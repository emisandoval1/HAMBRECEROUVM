<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Educación de Calidad</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background-color: #f4f6f9;
            text-align: center;
        }

        header {
            background-color: #2c3e50;
            color: white;
            padding: 15px;
        }

        /* Imagen principal */
        .banner img {
            width: 100%;
            height: 250px;
            object-fit: cover;
        }

        /* Marquesina */
        .marquesina {
            width: 100%;
            overflow: hidden;
            white-space: nowrap;
            background: #3498db;
            color: white;
            font-size: 20px;
            padding: 10px 0;
        }

        .marquesina span {
            display: inline-block;
            padding-left: 100%;
            animation: mover 10s linear infinite;
        }

        @keyframes mover {
            0% { transform: translateX(0); }
            100% { transform: translateX(-100%); }
        }

        /* Botones */
        .botones {
            margin: 30px;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 15px;
        }

        .botones button {
            margin: 10px;
            padding: 10px;
            font-size: 16px;
            border: none;
            border-radius: 10px;
            background-color: #2980b9;
            color: white;
            cursor: pointer;
            width: 180px;
            transition: all 0.3s ease;
        }

        .botones img {
            width: 100%;
            height: 100px;
            border-radius: 8px;
            object-fit: cover;
            margin-bottom: 8px;
        }

        .botones button:hover {
            background-color: #1abc9c;
            transform: translateY(-5px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        /* Portafolio */
        .portafolio {
            background-color: white;
            margin: 30px;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0px 0px 10px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>

    <header>

    </header>

    <!-- Imagen principal -->
    <div class="banner">
